name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PASO CRÍTICO: Instalar JDK 17 necesario para las herramientas de Android modernas
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet and Dependencies
        run: pip install flet requests beautifulsoup4

      - name: Build APK
        # Usamos --arch arm64-v8a para asegurar compatibilidad con teléfonos modernos
        # y evitamos problemas con arquitecturas antiguas de 32 bits.
        run: echo "y" | flet build apk --arch arm64-v8a

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64
          path: build/apk/*.apk
